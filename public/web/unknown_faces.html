<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Vision - Unknown Faces Alert Center</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Glassmorphic CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar Mount -->
  <div id="sidebar-container"></div>

  <!-- Layout Wrapper -->
  <div class="layout-wrapper">
    <!-- Topbar Mount -->
    <div id="topbar-container"></div>

    <!-- Main Content -->
    <main class="main-content container-fluid animate-fade">
      
      <!-- Page actions header -->
      <div class="mb-4">
        <h5 class="text-primary fw-bold m-0">Unknown Face Alerts</h5>
        <p class="text-secondary text-xs m-0">Unregistered individuals intercepted on system boundary vectors. Upgrade them to known keys to authorized database access.</p>
      </div>

      <!-- Cards Grid -->
      <div class="row g-4" id="unknown-grid">
        <!-- Rendered dynamically -->
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-secondary text-xs mt-2">Correlating facial alert feeds...</p>
        </div>
      </div>

    </main>

    <!-- Upgrade / Registration Modal -->
    <div class="modal fade" id="upgradeFaceModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card p-3" style="border-radius: 16px;">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title text-primary fw-bold">Upgrade Biometric Key</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="upgrade-face-form" onsubmit="handleUpgradeFace(event)">
              <input type="hidden" id="upgrade-tracking-id">
              
              <div class="mb-3">
                <label class="text-secondary text-xs fw-semibold mb-1">Assigned Name</label>
                <input type="text" class="form-control form-control-glass text-xs" id="upgrade-name" required placeholder="Marcus Brody">
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="text-secondary text-xs fw-semibold mb-1">Gender Class</label>
                  <input type="text" class="form-control form-control-glass text-xs" id="upgrade-gender" readonly>
                </div>
                <div class="col-6">
                  <label class="text-secondary text-xs fw-semibold mb-1">Estimated Age</label>
                  <input type="number" class="form-control form-control-glass text-xs" id="upgrade-age" readonly>
                </div>
              </div>

              <div class="mb-3">
                <label class="text-secondary text-xs fw-semibold mb-1">Security Status Note</label>
                <textarea class="form-control form-control-glass text-xs" id="upgrade-notes" rows="2">Upgraded loitering tracking sequence.</textarea>
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-glass-primary py-2 text-xs">Verify & Authorize Key</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Mount -->
    <div id="footer-container"></div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="layout.js"></script>
  <script>
    let unknownLogs = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchUnknowns();
    });

    async function fetchUnknowns() {
      try {
        const res = await fetch("/api/detections");
        const data = await res.json();
        if (data.status === "success") {
          // Filter logs that are 'unknown'
          unknownLogs = data.data.filter(log => log.type === "unknown");
          renderUnknowns();
        }
      } catch (e) {
        console.warn("Express endpoint offline. Loading fallback unknown face logs.", e);
        unknownLogs = [
          { id: "DET-1023", className: "person", confidence: 0.89, personName: "Unknown", gender: "Male", age: 26, mood: "Serious", trackingId: "TRK-0082", cameraId: "Backyard Loading Dock", timestamp: new Date(Date.now() - 3600000).toISOString(), note: "Unregistered human loitering detected near core node." }
        ];
        renderUnknowns();
      }
    }

    function renderUnknowns() {
      const grid = document.getElementById("unknown-grid");
      if (!grid) return;

      if (unknownLogs.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="material-icons text-secondary mb-3" style="font-size: 60px; opacity: 0.2;">fingerprint</i>
            <h6 class="text-secondary">Boundary Security is Cleared</h6>
            <p class="text-secondary text-xs">No unregistered or unknown facial alerts logged on the system.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = unknownLogs.map(log => {
        const dateObj = new Date(log.timestamp);
        const dateStr = dateObj.toLocaleDateString();
        const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const confPct = Math.round(log.confidence * 100) + "%";
        const thumbUrl = log.photoUrl || `https://api.dicebear.com/7.x/identicon/svg?seed=${log.id}`;

        return `
          <div class="col-12 col-sm-6 col-md-4 col-xl-3 face-card animate-fade">
            <div class="glass-card p-3 text-center border-danger border-opacity-20" style="border-width: 1px;">
              
              <!-- Subject Avatar/Photo -->
              <div class="position-relative d-inline-block mb-3">
                <img src="${thumbUrl}" alt="Unknown" class="rounded-circle border border-danger p-1 bg-dark bg-opacity-20" style="width: 80px; height: 80px; object-fit: cover;">
                <span class="position-absolute bottom-0 end-0 badge bg-danger p-1 d-flex align-items-center rounded-circle border border-dark" title="Unrecognized Identity Alert">
                  <i class="material-icons m-0" style="font-size: 11px;">warning</i>
                </span>
              </div>

              <!-- Content details -->
              <h6 class="text-danger fw-bold mb-1 font-mono">${log.trackingId}</h6>
              <p class="text-secondary text-xs m-0">Est: ${log.age || 25} yrs | Emotion: ${log.mood || 'Alert'}</p>
              
              <div class="my-3 py-2 px-3 bg-dark bg-opacity-25 rounded-3 text-start text-xs text-secondary" style="min-height: 72px; border: 1px solid var(--glass-border);">
                <strong>Conf:</strong> <span class="text-danger fw-bold">${confPct}</span><br>
                <strong>Camera:</strong> ${log.cameraId}<br>
                <strong>Time:</strong> ${dateStr} ${timeStr}
              </div>

              <!-- Controls -->
              <div class="d-flex justify-content-between gap-1.5">
                <button class="btn btn-glass btn-sm text-xs py-1.5 flex-grow-1" onclick="viewUnknown('${log.id}')">View</button>
                <button class="btn btn-glass-primary btn-sm text-xs py-1.5 flex-grow-1" onclick="openUpgradeModal('${log.trackingId}', '${log.gender}', '${log.age || 25}')">Register</button>
                <button class="btn btn-glass btn-sm text-xs py-1.5 text-danger" onclick="deleteAlert('${log.id}')"><i class="material-icons m-0 text-danger" style="font-size: 15px;">delete</i></button>
              </div>

            </div>
          </div>
        `;
      }).join("");
    }

    function openUpgradeModal(trackingId, gender, age) {
      document.getElementById("upgrade-tracking-id").value = trackingId;
      document.getElementById("upgrade-gender").value = gender;
      document.getElementById("upgrade-age").value = age;
      
      const modalEl = document.getElementById('upgradeFaceModal');
      const modalInstance = new bootstrap.Modal(modalEl);
      modalInstance.show();
    }

    async function handleUpgradeFace(e) {
      e.preventDefault();
      const name = document.getElementById("upgrade-name").value;
      const gender = document.getElementById("upgrade-gender").value;
      const age = document.getElementById("upgrade-age").value;
      const notes = document.getElementById("upgrade-notes").value;
      const trackingId = document.getElementById("upgrade-tracking-id").value;

      try {
        const res = await fetch("/api/faces/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, gender, age, moodTrend: notes })
        });
        const data = await res.json();
        if (data.status === "success") {
          triggerNotification(`Subject ${name} has been upgraded & authorized.`, "success");
          
          // Remove from local unknown view
          unknownLogs = unknownLogs.filter(log => log.trackingId !== trackingId);
          renderUnknowns();
          
          // Hide modal
          const modalEl = document.getElementById('upgradeFaceModal');
          const modalInstance = bootstrap.Modal.getInstance(modalEl);
          modalInstance.hide();
          document.getElementById("upgrade-face-form").reset();
        }
      } catch (err) {
        // Mocking behavior
        unknownLogs = unknownLogs.filter(log => log.trackingId !== trackingId);
        renderUnknowns();
        
        // Hide modal
        const modalEl = document.getElementById('upgradeFaceModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        modalInstance.hide();
        document.getElementById("upgrade-face-form").reset();
        
        triggerNotification(`Upgrade simulated successfully for ${name}.`, "success");
      }
    }

    function deleteAlert(id) {
      if (!confirm("Remove this unrecognized alert from logs?")) return;
      unknownLogs = unknownLogs.filter(log => log.id !== id);
      renderUnknowns();
      triggerNotification("Alert reference cleared.", "success");
    }

    function viewUnknown(id) {
      const log = unknownLogs.find(l => l.id === id);
      if (log) {
        alert(`Unknown Face Telemetry:\nTracking: ${log.trackingId}\nConfidence: ${Math.round(log.confidence*100)}%\nLocation: ${log.cameraId}\nTime: ${new Date(log.timestamp).toLocaleString()}`);
      }
    }
  </script>
</body>
</html>
